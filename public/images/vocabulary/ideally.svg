  <path d="M0.0 -41.4L10.1 -13.8L39.4 -12.8L16.3 5.3L24.3 33.5L0.0 17.1L-24.3 33.5L-16.3 5.3L-39.4 -12.8L-10.1 -13.8z" class="goldp o"/></g>
<path d="M300 180Q315.0 144.0 330 180" fill="none" stroke="#80909d" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#ar)"/>
<path d="M500 90q10-16 0-30" fill="none" stroke="#80909d" stroke-width="3"/><path d="M522 90q10-16 0-30" fill="none" stroke="#80909d" stroke-width="3"/>
