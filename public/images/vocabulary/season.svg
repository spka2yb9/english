  <path d="M-100-70h200v140h-200z" fill="#e6f7ec" class="o"/>
  <circle cx="0" cy="-20" r="22" class="goldp o"/><g class="golds"><path d="M0 -56v-16" transform="rotate(0 0 -20)"/><path d="M0 -56v-16" transform="rotate(45 0 -20)"/><path d="M0 -56v-16" transform="rotate(90 0 -20)"/><path d="M0 -56v-16" transform="rotate(135 0 -20)"/><path d="M0 -56v-16" transform="rotate(180 0 -20)"/><path d="M0 -56v-16" transform="rotate(225 0 -20)"/><path d="M0 -56v-16" transform="rotate(270 0 -20)"/><path d="M0 -56v-16" transform="rotate(315 0 -20)"/></g>
