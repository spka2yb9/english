  <path d="M20-10h50v-40h-50z" class="goldd o"/>
  <circle cx="-50" cy="48" r="24" fill="none" stroke="#2f4055" stroke-width="8"/>
  <circle cx="40" cy="48" r="24" fill="none" stroke="#2f4055" stroke-width="8"/>
  <path d="M60-40l90-60" fill="none" stroke="#a66b15" stroke-width="12"/>
  <path d="M150-100l60 40" fill="none" stroke="#a66b15" stroke-width="12"/>
  <path d="M200-64q30 20 20 54l-56-14z" fill="#8d949a" class="o"/></g>
