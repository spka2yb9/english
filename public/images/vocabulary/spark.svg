  <g class="gold o"><circle cx="-70" cy="-70" r="7"/><circle cx="70" cy="-64" r="6"/><circle cx="0" cy="-96" r="8"/><circle cx="-30" cy="-104" r="5"/><circle cx="34" cy="-110" r="5"/></g>
