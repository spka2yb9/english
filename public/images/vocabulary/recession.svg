  <path d="M-90 60v-120h180V60z" fill="#fffdf6" class="o"/>
  <path d="M-90-60h180v20h-180z" class="teald o"/>
  <g fill="none" stroke="#80909d" stroke-width="7"><path d="M-70 -20h140"/><path d="M-70 0h140"/><path d="M-70 20h140"/><path d="M-70 40h140"/></g>
</g>
<g fill="none" stroke="#e86452" stroke-width="8" stroke-linecap="round"><path d="M440 140l40 40M480 140l-40 40"/></g>
