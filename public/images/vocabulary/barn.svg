  <path d="M-30-190h60v40h-60z" class="coralp o"/></g>
<g transform="translate(90 350)"><ellipse rx="40" ry="20" fill="#e0c48c" class="o"/><path d="M-30-10q30-14 60 0" fill="none" stroke="#a66b15" stroke-width="3"/></g><g transform="translate(510 350)"><ellipse rx="40" ry="20" fill="#e0c48c" class="o"/><path d="M-30-10q30-14 60 0" fill="none" stroke="#a66b15" stroke-width="3"/></g>
