</g>
<g fill="none" stroke="#80909d" stroke-width="5" stroke-dasharray="16 12"><path d="M60 250q120-30 240 0t240-16"/></g>
<g fill="none" stroke="#80909d" stroke-width="5.6" stroke-linecap="round"><path d="M506.0 76.0l28.0 28.0M534.0 76.0l-28.0 28.0"/></g>
