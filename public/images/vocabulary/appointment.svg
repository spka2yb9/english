  <g transform="translate(250 220)">
  <path d="M-150-130h300v260h-300z" class="paper"/>
  <g fill="none" stroke="#80909d" stroke-width="3"><path d="M-110 -90h220"/><path d="M-110 -45h220"/><path d="M-110 0h220"/><path d="M-110 45h220"/><path d="M-110 90h220"/></g>
  <g fill="#80909d"><rect x="-140" y="-100" width="24" height="10"/><rect x="-140" y="-55" width="24" height="10"/><rect x="-140" y="-10" width="24" height="10"/></g>
  <path d="M-110-30h180v40h-180z" class="coralp o"/>
</g>
<g transform="translate(480 150)">
