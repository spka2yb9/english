  <path d="M0 0v-160" fill="none" stroke="#2f4055" stroke-width="7" stroke-linecap="round"/>
  <path d="M8-152q70 60 60 140H8z" fill="#fffdf6" stroke="#2f4055" stroke-width="3"/>
  <path d="M-8-140q-50 60-44 128h44z" fill="#f4fbff" stroke="#2f4055" stroke-width="3"/>
</g>
