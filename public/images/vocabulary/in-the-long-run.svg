  <path d="M-230 40l60 60 60 20 60-60 60-90 60-100" fill="none" stroke="#e86452" stroke-width="6" stroke-linejoin="round"/>
  <g fill="none" stroke="#80909d" stroke-width="3" stroke-dasharray="8 8"><path d="M-244 40h490M-110-180v300"/></g>
</g>
<g class="a" marker-end="url(#ar)" stroke="#80909d" stroke-width="4"><path d="M70 340h110"/></g>
<g class="a" marker-end="url(#ar)" stroke="#4e986a" stroke-width="5"><path d="M200 340h330"/></g>
