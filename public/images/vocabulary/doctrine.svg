  <path d="M-130-130h260v260h-260z" fill="#fffdf6" class="o"/>
  <path d="M-14-90h28v50h50v28h-50v50h-28v-50h-50v-28h50z" class="violetp o"/>
  <g fill="none" stroke="#80909d" stroke-width="4"><path d="M-90 70h180M-90 100h140"/></g>
</g>
<g fill="none" stroke="#4e986a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M478 180l18 20 32-40"/></g>
