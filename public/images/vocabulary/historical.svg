  <ellipse cx="-130" cy="0" rx="18" ry="70" class="goldd o"/>
  <ellipse cx="130" cy="0" rx="18" ry="70" class="goldd o"/>
  <g fill="none" stroke="#80909d" stroke-width="3"><path d="M-100-40h190M-100-10h190M-100 20h150"/></g>
</g>
<path d="M100 350h400" class="a" marker-end="url(#ar)"/>
<g fill="#2f4055"><circle cx="160" cy="350" r="7"/><circle cx="280" cy="350" r="7"/><circle cx="400" cy="350" r="7"/></g>
