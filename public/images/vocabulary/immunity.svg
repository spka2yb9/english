  <g transform="translate(0 0) scale(1.1)"><g class="violets" stroke-width="4"><path d="M0 -22v-12" transform="rotate(0)"/><path d="M0 -22v-12" transform="rotate(45)"/><path d="M0 -22v-12" transform="rotate(90)"/><path d="M0 -22v-12" transform="rotate(135)"/><path d="M0 -22v-12" transform="rotate(180)"/><path d="M0 -22v-12" transform="rotate(225)"/><path d="M0 -22v-12" transform="rotate(270)"/><path d="M0 -22v-12" transform="rotate(315)"/></g><circle r="22" class="violet o"/><circle cx="-7" cy="-5" r="4" fill="#fffefd"/></g>
