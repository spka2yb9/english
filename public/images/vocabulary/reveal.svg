</g>
<path d="M280 240h50" class="a" marker-end="url(#ar)"/>
<circle cx="500" cy="110" r="22" class="goldp o"/><g class="golds"><path d="M500 74v-16" transform="rotate(0 500 110)"/><path d="M500 74v-16" transform="rotate(45 500 110)"/><path d="M500 74v-16" transform="rotate(90 500 110)"/><path d="M500 74v-16" transform="rotate(135 500 110)"/><path d="M500 74v-16" transform="rotate(180 500 110)"/><path d="M500 74v-16" transform="rotate(225 500 110)"/><path d="M500 74v-16" transform="rotate(270 500 110)"/><path d="M500 74v-16" transform="rotate(315 500 110)"/></g>
<path d="M60 356h480" class="a"/>
