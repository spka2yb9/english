<path d="M240 280L420 80" fill="none" stroke="#238b83" stroke-width="10" stroke-linecap="round"/>
<path d="M240 280h130" fill="none" stroke="#80909d" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M300 280a60 60 0 0 0 26-48" fill="none" stroke="#e86452" stroke-width="4"/>
<circle cx="240" cy="280" r="8" class="teal o"/><circle cx="420" cy="80" r="8" class="teal o"/>
