<path d="M60 330q22-12 44 0" fill="none" stroke="#4e86c6" stroke-width="4"/><path d="M180 330q22-12 44 0" fill="none" stroke="#4e86c6" stroke-width="4"/><path d="M300 330q22-12 44 0" fill="none" stroke="#4e86c6" stroke-width="4"/><path d="M420 330q22-12 44 0" fill="none" stroke="#4e86c6" stroke-width="4"/>
