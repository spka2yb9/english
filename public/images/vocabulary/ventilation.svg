  <circle r="70" fill="#5a6270" class="o"/>
  <g fill="#8f9aa6" class="o">
<path d="M0 0q40-20 60 10-30 34-60-10z" transform="rotate(0)"/><path d="M0 0q40-20 60 10-30 34-60-10z" transform="rotate(90)"/><path d="M0 0q40-20 60 10-30 34-60-10z" transform="rotate(180)"/><path d="M0 0q40-20 60 10-30 34-60-10z" transform="rotate(270)"/>
  </g>
  <circle r="14" fill="#2f4055"/>
</g>
<g fill="none" stroke="#4e86c6" stroke-width="5" stroke-linecap="round">
