  <path d="M40 352h520v20H40z" fill="#c9a464" class="o"/><path d="M80 372v60M520 372v60" stroke="#a0764a" stroke-width="14" stroke-linecap="round" fill="none"/>
<g transform="translate(300 260) rotate(-6)">
  <path d="M-120-100h240v200h-240z" class="paper"/>
  <rect x="-90" y="-60" width="180" height="10" rx="5" fill="#80909d"/><rect x="-90" y="-26" width="130" height="10" rx="5" fill="#80909d"/><rect x="-90" y="8" width="80" height="10" rx="5" fill="#80909d"/><rect x="-90" y="42" width="180" height="10" rx="5" fill="#80909d"/></g>
<g transform="translate(250 180) rotate(-6)">
  <path d="M-20 60V-30a20 20 0 0 1 40 0v70a12 12 0 0 1-24 0V-16" fill="none" stroke="#8a97a3" stroke-width="9" stroke-linecap="round"/></g>
