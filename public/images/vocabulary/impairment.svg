<circle cx="110" cy="150" r="9" class="coral o"/><circle cx="200" cy="154" r="9" class="coral o"/><circle cx="290" cy="160" r="9" class="coral o"/><circle cx="380" cy="250" r="9" class="coral o"/><circle cx="470" cy="290" r="9" class="coral o"/>
