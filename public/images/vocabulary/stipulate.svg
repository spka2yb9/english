  <path d="M40 352h520v20H40z" fill="#c9a464" class="o"/><path d="M80 372v60M520 372v60" stroke="#a0764a" stroke-width="14" stroke-linecap="round" fill="none"/>
<g transform="translate(280 230)">
  <path d="M-150-110h300v220h-300z" class="paper"/>
  <rect x="-120" y="-80" width="230" height="12" rx="6" fill="#80909d"/><rect x="-120" y="-40" width="180" height="12" rx="6" fill="#80909d"/><rect x="-120" y="0" width="130" height="12" rx="6" fill="#80909d"/><rect x="-120" y="40" width="230" height="12" rx="6" fill="#80909d"/>
  <rect x="-120" y="40" width="200" height="14" rx="7" class="coral"/>
  <rect x="-140" y="34" width="250" height="26" rx="13" fill="none" stroke="#e86452" stroke-width="4"/></g>
<g transform="translate(470 140) rotate(34)">
