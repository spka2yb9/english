<circle cx="160" cy="150" r="40" class="goldp o"/><g class="golds"><path d="M160 96v-16" transform="rotate(0 160 150)"/><path d="M160 96v-16" transform="rotate(45 160 150)"/><path d="M160 96v-16" transform="rotate(90 160 150)"/><path d="M160 96v-16" transform="rotate(135 160 150)"/><path d="M160 96v-16" transform="rotate(180 160 150)"/><path d="M160 96v-16" transform="rotate(225 160 150)"/><path d="M160 96v-16" transform="rotate(270 160 150)"/><path d="M160 96v-16" transform="rotate(315 160 150)"/></g>
