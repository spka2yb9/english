<g fill="#ffffff" stroke="#cfe0ee" stroke-width="2"><circle cx="430" cy="160" r="10"/><circle cx="460" cy="190" r="8"/><circle cx="410" cy="200" r="7"/></g>
<path d="M180 300q120 40 240 0" class="a" marker-end="url(#ar)"/>
