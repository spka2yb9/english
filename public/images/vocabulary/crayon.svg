  <rect x="-46" y="-56" width="14" height="60" rx="3" fill="#e86452" stroke="#2f4055" stroke-width="2"/><rect x="-24" y="-56" width="14" height="60" rx="3" fill="#d99a2b" stroke="#2f4055" stroke-width="2"/><rect x="-2" y="-56" width="14" height="60" rx="3" fill="#4e986a" stroke="#2f4055" stroke-width="2"/><rect x="20" y="-56" width="14" height="60" rx="3" fill="#4e86c6" stroke="#2f4055" stroke-width="2"/><rect x="42" y="-56" width="14" height="60" rx="3" fill="#816eb2" stroke="#2f4055" stroke-width="2"/></g>
</svg>
