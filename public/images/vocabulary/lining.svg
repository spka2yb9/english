<circle cx="300" cy="220" r="0" fill="none" stroke="#80909d" stroke-width="4" stroke-dasharray="11 10"/>
<path d="M500 130h-50" fill="none" stroke="#e86452" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#ar)"/>
