  <circle cx="-100" cy="40" r="26" class="teal o"/>
  <path d="M-150 130q60-80 120 0z" class="teal o"/>
  <rect x="44" y="6" width="126" height="12" rx="6" fill="#80909d"/><rect x="44" y="34" width="126" height="12" rx="6" fill="#80909d"/><rect x="44" y="62" width="126" height="12" rx="6" fill="#80909d"/><rect x="44" y="90" width="126" height="12" rx="6" fill="#80909d"/></g>
