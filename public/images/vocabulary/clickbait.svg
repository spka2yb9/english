  <g class="corals" stroke-width="5"><path d="M0 -100v-24" transform="rotate(-30)"/><path d="M0 -100v-24" transform="rotate(0)"/><path d="M0 -100v-24" transform="rotate(30)"/></g></g>
<path d="M400 90v100q0 60-56 60t-56-40" fill="none" stroke="#2f4055" stroke-width="8" stroke-linecap="round"/>
