    <path d="M-24-4q3-26 24-26 22 0 26 24-12-10-26-4-11-10-24 6z" fill="#34475a"/>
    <circle cx="-8" cy="2" r="2.4" class="ink"/><circle cx="8" cy="2" r="2.4" class="ink"/>
  </g>
</g>
