<path d="M210 200h50" fill="none" stroke="#80909d" stroke-width="4" stroke-dasharray="9 8"/>
<g transform="translate(400 210)"><rect x="-110" y="-130" width="220" height="260" rx="6" fill="#f7f3e8" class="o"/>
