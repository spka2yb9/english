  <path d="M-230 100l50-24 50-30 50-36" fill="none" stroke="#238b83" stroke-width="7" stroke-linejoin="round"/>
  <g fill="#176a66">
<circle cx="-230" cy="100" r="8"/><circle cx="-180" cy="70" r="8"/><circle cx="-130" cy="40" r="8"/><circle cx="-80" cy="10" r="8"/>
  </g>
