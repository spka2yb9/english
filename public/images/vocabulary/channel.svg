  <path d="M-180-140h360v250h-360z" fill="#dfe6ea" class="o"/>
  <path d="M-150-110h300v190h-300z" class="bluep o"/>
  <g fill="#fffdf6"><rect x="80" y="-90" width="50" height="40"/></g>
  <g fill="#2f4055"><rect x="92" y="-80" width="26" height="20"/></g>
</g>
