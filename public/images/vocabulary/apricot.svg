  <ellipse cx="26" cy="-104" rx="24" ry="12" class="green o" transform="rotate(-20 26 -104)"/>
  <path d="M0-68v136" fill="none" stroke="#a66b15" stroke-width="3"/></g>
<g transform="translate(430 260)">
