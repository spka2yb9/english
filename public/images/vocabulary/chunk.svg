  <g class="mutedfill" fill="#d9b476" stroke="#2f4055" stroke-width="2"><rect x="50" y="-40" width="50" height="40"/><rect x="50" y="10" width="50" height="40"/></g>
</g>
<path d="M310 250h50" class="a" marker-end="url(#ar)"/>
<path d="M60 346h480" class="a"/>
