<circle cx="450" cy="300" r="20" class="gold o"/><circle cx="450" cy="300" r="12.4" fill="none" stroke="#a66b15" stroke-width="2.5"/><circle cx="450" cy="270" r="20" class="gold o"/><circle cx="450" cy="270" r="12.4" fill="none" stroke="#a66b15" stroke-width="2.5"/>
