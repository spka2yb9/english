<g transform="translate(430 340) scale(1.3)"><path d="M-7 0v-46h14V0" class="goldd"/><circle cx="-16" cy="-58" r="22" class="greenp o"/><circle cx="14" cy="-64" r="25" class="greenp o"/><circle cx="0" cy="-86" r="20" class="greenp o"/></g>
<path d="M250 200h100" class="a" marker-end="url(#ar)"/>
