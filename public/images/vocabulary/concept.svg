    <circle cx="0" cy="0" r="46"/>
  </g>
  <g fill="none" stroke="#80909d" stroke-width="3" stroke-dasharray="6 8"><path d="M-200-40h400M-200 60h400M-60-150v300M60-150v300"/></g>
</g>
