  <path d="M-130-80h260v160h-260z" class="paper"/>
  <g><rect x="-100" y="-56" width="120" height="10" rx="5" fill="#80909d"/><path d="M40 -52h50" stroke="#2f4055" stroke-width="4" fill="none"/></g><g><rect x="-100" y="-24" width="90" height="10" rx="5" fill="#80909d"/><path d="M40 -20h50" stroke="#2f4055" stroke-width="4" fill="none"/></g><g><rect x="-100" y="8" width="120" height="10" rx="5" fill="#80909d"/><path d="M40 12h50" stroke="#2f4055" stroke-width="4" fill="none"/></g><g><rect x="-100" y="40" width="90" height="10" rx="5" fill="#80909d"/><path d="M40 44h50" stroke="#2f4055" stroke-width="4" fill="none"/></g></g>
