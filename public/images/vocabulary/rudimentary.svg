  <path d="M-36 8L-70 76M36 8l34 68" fill="none" stroke="#f2c29d" stroke-width="12" stroke-linecap="round"/>
  <path d="M-18 100l-10 60M18 100l10 60" fill="none" stroke="#315f98" stroke-width="13" stroke-linecap="round"/>
