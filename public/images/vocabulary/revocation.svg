  <circle cx="84" cy="54" r="28" fill="none" stroke="#80909d" stroke-width="5"/></g>
<g transform="translate(300 200)"><path d="M-160 90L160-70" stroke="#e86452" stroke-width="14" stroke-linecap="round" fill="none"/></g>
