<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img"
     aria-label="羅針盤の針が示す方角を、地図の上で読み取る">
  <style>
    .a { fill: none; stroke: #2f4055; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .o { stroke: #2f4055; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .ground { fill: #edf3ed; stroke: none; }
    .paper { fill: #fffefd; stroke: #2f4055; stroke-width: 2.5; stroke-linejoin: round; }
    .muted { fill: none; stroke: #80909d; stroke-width: 2.5; stroke-dasharray: 7 8; stroke-linecap: round; }
    .ink { fill: #2f4055; stroke: none; }
    text { display: none; }
    .teal { fill: #238b83; } .tealp { fill: #dff4ef; } .teald { fill: #176a66; } .teals { fill: none; stroke: #238b83; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .coral { fill: #e86452; } .coralp { fill: #fde9e3; } .corald { fill: #b74338; } .corals { fill: none; stroke: #e86452; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .gold { fill: #d99a2b; } .goldp { fill: #fff0c5; } .goldd { fill: #a66b15; } .golds { fill: none; stroke: #d99a2b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .blue { fill: #4e86c6; } .bluep { fill: #e1edfb; } .blued { fill: #315f98; } .blues { fill: none; stroke: #4e86c6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .violet { fill: #816eb2; } .violetp { fill: #eee8fb; } .violetd { fill: #5f4d91; } .violets { fill: none; stroke: #816eb2; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .green { fill: #4e986a; } .greenp { fill: #e1f3e5; } .greend { fill: #34734d; } .greens { fill: none; stroke: #4e986a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="600" height="400" rx="20" fill="#fffaf1"/>
  <path d="M0 306h600v94H0z" class="ground"/>
  <path d="M40 330h520v20H40z" fill="#c9a464" class="o"/><path d="M80 350v60M520 350v60" stroke="#a0764a" stroke-width="14" stroke-linecap="round" fill="none"/>
<g transform="translate(300 200)">
  <circle r="120" fill="#fffefd" class="o"/>
  <circle r="100" fill="none" stroke="#80909d" stroke-width="3"/>
  <path d="M0-100v-14" transform="rotate(0)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(30)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(60)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(90)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(120)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(150)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(180)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(210)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(240)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(270)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(300)" stroke="#80909d" stroke-width="4" fill="none"/><path d="M0-100v-14" transform="rotate(330)" stroke="#80909d" stroke-width="4" fill="none"/>
  <path d="M0-88L20 0 0 26-20 0z" class="coral o"/>
  <path d="M0 88L20 0-20 0z" fill="#fffefd" class="o"/>
  <circle r="9" class="ink"/></g>
<g transform="translate(300 60)"><path d="M-12 14L0-16l12 30" fill="none" stroke="#2f4055" stroke-width="4" stroke-linecap="round"/></g>
</svg>
