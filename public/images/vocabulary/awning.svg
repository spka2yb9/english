  <path d="M-130-60h260v160h-260z" fill="#dfeaf2" class="o"/></g>
<g transform="translate(300 200)">
  <path d="M-180-40h360l40 70h-440z" class="coral o"/>
  <path d="M-150 -40l-22 70" stroke="#fffefd" stroke-width="16" fill="none"/><path d="M-90 -40l-22 70" stroke="#fffefd" stroke-width="16" fill="none"/><path d="M-30 -40l-22 70" stroke="#fffefd" stroke-width="16" fill="none"/><path d="M30 -40l-22 70" stroke="#fffefd" stroke-width="16" fill="none"/><path d="M90 -40l-22 70" stroke="#fffefd" stroke-width="16" fill="none"/><path d="M150 -40l-22 70" stroke="#fffefd" stroke-width="16" fill="none"/>
  <path d="M-220 30h440" fill="none" stroke="#b74338" stroke-width="8" stroke-linecap="round"/></g>
<circle cx="90" cy="80" r="34" class="goldp o"/><g class="golds"><path d="M90 32v-16" transform="rotate(0 90 80)"/><path d="M90 32v-16" transform="rotate(45 90 80)"/><path d="M90 32v-16" transform="rotate(90 90 80)"/><path d="M90 32v-16" transform="rotate(135 90 80)"/><path d="M90 32v-16" transform="rotate(180 90 80)"/><path d="M90 32v-16" transform="rotate(225 90 80)"/><path d="M90 32v-16" transform="rotate(270 90 80)"/><path d="M90 32v-16" transform="rotate(315 90 80)"/></g>
