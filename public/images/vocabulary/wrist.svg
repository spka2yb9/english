  <path d="M-30 10h60v40h-60z" fill="#f2c29d" stroke="#a86f55" stroke-width="3"/>
  <path d="M-40 50q40-16 80 0 20 60 0 90-40 16-80 0-20-30 0-90z" fill="#f2c29d" stroke="#a86f55" stroke-width="3"/>
  <circle cx="0" cy="30" r="42" fill="none" stroke="#e86452" stroke-width="5" stroke-dasharray="11 9"/>
</g>
<path d="M440 250q-60 10-100 10" class="a" marker-end="url(#ar)"/>
