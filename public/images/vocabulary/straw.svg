  <path d="M-10 20h20v14h-20z" fill="#fffefd"/><path d="M-10 60h20v14h-20z" fill="#fffefd"/><path d="M-10 100h20v14h-20z" fill="#fffefd"/><path d="M-10 140h20v14h-20z" fill="#fffefd"/>
