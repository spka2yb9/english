<ellipse cx="150" cy="240" rx="14" ry="8" class="green o" transform="rotate(-20 150 240)"/><ellipse cx="220" cy="270" rx="14" ry="8" class="green o" transform="rotate(-2 220 270)"/><ellipse cx="290" cy="240" rx="14" ry="8" class="green o" transform="rotate(16 290 240)"/><ellipse cx="360" cy="270" rx="14" ry="8" class="green o" transform="rotate(34 360 270)"/>
